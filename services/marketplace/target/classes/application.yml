server:
  port: ${PORT:8081}
  shutdown: graceful
spring:
  application:
    name: helfio-marketplace
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/helfio}
    username: ${DB_USER:helfio}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/helfio}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
helfio:
  event-topic: ${KAFKA_TOPIC:helfio.domain-events}
